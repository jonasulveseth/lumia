        description: Partner, family, friends and the communities you belong to.
        topics: [Partner, Family, Friends, Community]
      career:
        name: Career & work
        description: Goals, skills, projects and how work feels.
        topics: [Goals, Skills, Projects, Feedback]
      learning:
        name: Learning
        description: What you want to understand or master – books, courses, crafts.
        topics: [Reading, Courses, Skills, Curiosity]
      finance:
        name: Finance
        description: Buffer, savings and money going to what you value.
        topics: [Buffer, Savings, Spending, Goals]
      meaning:
        name: Meaning & values
        description: What matters to you and whether life is moving in that direction.
        topics: [Values, Purpose, Contribution, Reflection]
    approaches:
      mediterranean: { name: Mediterranean diet, description: "Vegetables, legumes, olive oil, fish and nuts. Little red meat and ultra-processed food." }
      low_carb: { name: Low carb / LCHF, description: "Less sugar and starch, more protein, fat and green vegetables – Atkins style." }
      plant_based: { name: Plant-based, description: "Mostly or only plants, keeping an eye on protein, B12, iron and omega-3." }
      intermittent_fasting: { name: Intermittent fasting, description: "A shorter eating window, for example 16:8." }
      flexible_counting: { name: Flexible dieting, description: "Nothing forbidden, but track protein and energy over time." }
      nordic: { name: Nordic diet, description: "Seasonal food, root vegetables, berries, rye, fish and rapeseed oil." }
      longevity_training: { name: Training for longevity, description: "Lots of easy cardio (zone 2), some intervals, strength and balance." }
      strength_first: { name: Strength first, description: "Progressive strength training 2–4 times a week, supported by protein and sleep." }
      sleep_first: { name: Sleep first, description: "Regular times, morning light and sleep as the foundation for everything else." }
      daily_movement: { name: Everyday movement, description: "Walks, stairs and short breaks from sitting." }
      stoicism: { name: Stoicism, description: "Separate what you can and cannot control. Daily reflection." }
      mindfulness: { name: Mindfulness, description: "Regular attention training – short and often." }
      cbt_tools: { name: CBT tools, description: "Notice automatic thoughts, test them and take small steps. Not a replacement for therapy." }
      act: { name: ACT, description: "Accept difficult feelings and act towards your values." }
      gottman: { name: The Gottman method, description: "Turn towards bids for connection, soft start-ups and repair attempts." }
      nonviolent_communication: { name: Nonviolent Communication, description: "Observation, feeling, need and a concrete request." }
      attachment_aware: { name: Attachment-aware, description: "Understand your own and others' attachment patterns." }
      deep_work: { name: Deep Work, description: "Protect long blocks of undistracted focus." }
      ikigai: { name: Ikigai, description: "Where what you love, are good at, the world needs and you can be paid for meet." }
      design_your_life: { name: Designing Your Life, description: "Prototype career choices with conversations and small experiments." }
      career_capital: { name: Career capital, description: "Build rare and valuable skills first – passion follows." }
      spaced_repetition: { name: Spaced repetition, description: "Test yourself instead of re-reading." }
      learning_by_doing: { name: Learning by doing, description: "Projects just above your level, fast feedback." }
      feynman: { name: The Feynman technique, description: "Explain simply, find the gaps, go back to the source." }
      buffer_first: { name: Buffer first, description: "A few months of buffer and no expensive debt before anything else." }
      index_investing: { name: Index investing, description: "Cheap broad funds, automatic monthly saving, long horizon." }
      fire: { name: FIRE, description: "High savings rate and lower fixed costs towards financial independence." }
      values_based_spending: { name: Values-based spending, description: "Generous on what you value, frugal on the rest." }
      values_compass: { name: Values compass, description: "Name your values and check weekly whether your time matches." }
      logotherapy: { name: Logotherapy (Frankl), description: "Meaning through creating, loving and facing the unavoidable." }
      contribution: { name: Contribution, description: "Meaning through helping others and belonging to something bigger." }
      atomic_habits: { name: Atomic Habits, description: "Make it obvious, attractive, easy and satisfying. Identity before goals." }
      tiny_habits: { name: Tiny Habits, description: "Anchor a tiny habit to something you already do and celebrate immediately." }
      implementation_intentions: { name: If-then plans, description: "\"When X happens, I will do Y\" – concrete plans for when and where." }
