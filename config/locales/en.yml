  lumia:
    areas:
      health:
        name: Health & body
        description: Sleep, movement, recovery and what your lab results say.
        topics: [Sleep, Movement, Recovery, Lab results]
      nutrition:
        name: Nutrition
        description: What you eat, how it makes you feel and which food philosophy fits you.
        topics: [Meals, Food philosophy, Habits, Drinks]
